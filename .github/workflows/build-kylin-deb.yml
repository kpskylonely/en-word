name: Build Kylin deb

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-3.0 \
            libgtk-3-0 \
            libnotify4 \
            dpkg-dev
          if ! sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-0 gir1.2-webkit2-4.1; then
            sudo apt-get install -y --no-install-recommends \
              libwebkit2gtk-4.0-37 gir1.2-webkit2-4.0
          fi

      - name: Install npm dependencies
        run: npm ci

      - name: Build dictionary database
        run: npm run db:download

      - name: Build .deb package
        run: npm run pack:kylin

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: en-word-deb-amd64
          path: release/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.deb
          generate_release_notes: true
