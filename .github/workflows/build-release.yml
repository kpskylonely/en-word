name: Build release packages

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Prepare dictionary database
        run: |
          npm ci
          npm run db:download

      - name: Build .deb in Ubuntu 20.04 container (glibc 2.31)
        run: bash scripts/build_kylin_docker.sh

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: en-word-deb-${{ matrix.arch }}
          path: release/en-word_*_${{ matrix.arch }}.deb
          if-no-files-found: error
          retention-days: 30

  build-dmg:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install npm dependencies
        run: npm ci

      - name: Build dictionary database
        run: npm run db:download

      - name: Build .dmg package
        run: npm run pack:mac

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: en-word-dmg
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 30

  build-win:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install npm dependencies
        run: npm ci

      - name: Build dictionary database
        run: npm run db:download

      - name: Build Windows package
        shell: bash
        run: npm run pack:win

      - name: Upload Windows zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: en-word-win
          path: |
            release/*.zip
            release/EnWord/EnWord.exe
          if-no-files-found: error
          retention-days: 30

  pre-release:
    needs: [build-linux, build-dmg, build-win]
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare release metadata
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "tag=v${VERSION}-pre.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "name=v${VERSION} pre-release (${SHORT_SHA})" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: true
          make_latest: false
          files: |
            artifacts/*.deb
            artifacts/*.dmg
            artifacts/*.zip
          generate_release_notes: true

  release:
    needs: [build-linux, build-dmg, build-win]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          make_latest: true
          files: |
            artifacts/*.deb
            artifacts/*.dmg
            artifacts/*.zip
          generate_release_notes: true
